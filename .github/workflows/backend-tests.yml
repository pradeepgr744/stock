name: Backend and frontend checks

on:
  push:
    branches:
      - main
      - feat/multifactor-nse-scanner
      - feat/intraday-news-risk-engine
  pull_request:
    paths:
      - "trading-assistant/backend/**"
      - "trading-assistant/frontend/**"
      - "trading-assistant/docs/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-assistant/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trading-assistant/backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend modules and scripts
        run: python -m compileall -q app scripts tests
      - name: Run backend unit tests
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-assistant/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trading-assistant/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check and build frontend
        run: npm run build
